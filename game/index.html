<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solmar Bay — an original open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1026; font-family: Verdana, Geneva, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); z-index: 5; }
  #hud-topleft { position: absolute; top: 14px; left: 16px; }
  #hud-cash { font-size: 30px; font-weight: bold; color: #7dff9a; }
  #hud-objective { font-size: 14px; margin-top: 4px; max-width: 420px; background: rgba(0,0,0,.45); padding: 6px 10px; border-left: 4px solid #ffd81a; border-radius: 3px; }
  #hud-clock { font-size: 12px; margin-top: 4px; color: #cfe3ff; }
  #hud-topright { position: absolute; top: 14px; right: 16px; text-align: right; }
  #hud-stars { font-size: 26px; letter-spacing: 3px; color: #ffd81a; }
  #hud-health { width: 210px; height: 14px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.5); border-radius: 3px; margin-top: 6px; margin-left: auto; }
  #hud-healthbar { height: 100%; width: 100%; background: #2aff66; border-radius: 2px; }
  #hud-weapon { font-size: 14px; margin-top: 6px; }
  #hud-bottomleft { position: absolute; bottom: 16px; left: 16px; }
  #hud-speed { font-size: 22px; font-weight: bold; }
  #hud-radio { font-size: 13px; color: #ffd81a; margin-top: 3px; }
  #hud-minimap { position: absolute; right: 16px; bottom: 16px; width: 176px; height: 176px; border: 2px solid rgba(255,255,255,.55); border-radius: 50%; background: #10141a; }
  #hud-crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 26px; color: #fff; opacity: 0; }
  #hud-toast { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); font-size: 19px; font-weight: bold; color: #ffd81a; opacity: 0; transition: opacity .3s; text-align: center; }
  #hud-dialogue { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); width: 620px; max-width: 86vw; background: rgba(8,10,20,.82); border: 1px solid rgba(255,216,26,.6); border-radius: 8px; padding: 12px 16px; }
  #hud-dlgwho { color: #ffd81a; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
  #hud-dlgtext { font-size: 16px; line-height: 1.45; }
  #hud-dlghint { text-align: right; font-size: 12px; color: #9fb3d8; margin-top: 6px; }
  #hud-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(255,0,0,.55) 100%); opacity: 0; }
  #screen-title, #screen-pause, #screen-over { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(10,16,38,.25), rgba(10,16,38,.78)); pointer-events: auto; text-align: center; }
  #screen-title h1 { font-size: 84px; margin: 0; letter-spacing: 6px; color: #ffd81a; text-shadow: 0 4px 0 #b03a2e, 0 8px 24px rgba(0,0,0,.8); }
  #screen-sub { font-size: 17px; max-width: 640px; line-height: 1.5; margin: 14px 0 26px; }
  #screen-title button, #screen-pause button, #screen-over button { pointer-events: auto; font-size: 20px; font-weight: bold; padding: 12px 34px; margin: 6px; border: none; border-radius: 6px; background: #ffd81a; color: #1a1a22; cursor: pointer; }
  #screen-title button:hover, #screen-pause button:hover, #screen-over button:hover { background: #ffe95a; }
  #btn-continue { background: #7dff9a !important; }
  #screen-controls { font-size: 13px; color: #cfe3ff; margin-top: 26px; max-width: 680px; line-height: 1.6; }
  #screen-pause h1, #screen-over h1 { font-size: 64px; margin: 0 0 12px; letter-spacing: 4px; }
  #screen-over p { font-size: 17px; max-width: 560px; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: drive and walk a sun-soaked coastal city, steal cars, outrun the police, and run missions for Mama Rosa"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud"></div>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
